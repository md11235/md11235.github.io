<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070c19">
  <link rel="stylesheet" href="{{ '/assets/css/nebula.css' | relative_url }}">
  {% seo %}
</head>
<body>
  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Sam 的知识库首页"><span class="brand-mark" aria-hidden="true">⌘</span><span>SAM / KNOWLEDGE LAB</span></a>
      <nav class="site-nav" aria-label="主导航">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>首页</a>
        <a href="{{ '/protomaps/' | relative_url }}">Protomaps</a>
        <a href="{{ '/archive/' | relative_url }}">全部文章</a>
        <a href="{{ '/blog_index.html' | relative_url }}">旧版归档</a>
        <a href="https://github.com/md11235/md11235.github.io" rel="noopener noreferrer">GitHub ↗</a>
      </nav>
    </div>
  </header>
  <main class="site-main">
    {% if page.url == '/' %}
      {{ content }}
    {% else %}
      <article class="article">
        <div class="article-header">
          <span class="eyebrow">SAM / TECH NOTES</span>
        </div>
        {{ content }}
      </article>
    {% endif %}
  </main>
  <footer class="site-footer"><div class="footer-inner"><span>© {{ 'now' | date: '%Y' }} · SAM / KNOWLEDGE LAB</span><span>Built on GitHub Pages · <a href="{{ '/' | relative_url }}">Back to home ↑</a></span></div></footer>
</body>
</html>
