name: Refresh chronological page index

on:
  push:
    branches: [master]
    paths-ignore:
      - 'page-index.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page-index
  cancel-in-progress: true

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build index from tracked pages
        run: python3 scripts/build_page_index.py
      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add page-index.json
          if git diff --cached --quiet; then
            echo "Index unchanged"
          else
            git commit -m "docs: refresh chronological page index"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
